name: Build APK

on:
  workflow_dispatch:        # boton "Run workflow" desde el navegador del movil
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar NDK y CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar rutas de C++ core
        run: |
          if [ -d "core" ]; then
            rm -rf android/app/src/main/cpp/core
            cp -r core android/app/src/main/cpp/core
            echo "Carpeta core copiada exitosamente a android/app/src/main/cpp/"
          else
            echo "Error: No se encontró la carpeta core en la raíz del repositorio."
            exit 1
          fi

      - name: Compilar APK debug
        working-directory: android
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --info
          else
            gradle assembleDebug --stacktrace --info
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: SonicColorsRecomp-debug
          path: android/app/build/outputs/apk/debug/*.apk
