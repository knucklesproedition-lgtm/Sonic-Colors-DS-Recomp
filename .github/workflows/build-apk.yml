name: Build APK

on:
  workflow_dispatch:            # boton "Run workflow" (se puede usar desde el movil)
  push:
    branches: [main, master]    # tambien se compila solo cada vez que subes archivos

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Funciona si subiste las carpetas (android/, core/, ...) O si subiste solo el .zip del proyecto.
      - name: Localizar el proyecto
        id: find
        run: |
          set -e
          HAVE=$(find . -path ./.git -prune -o -path '*/android/app/build.gradle.kts' -print -quit)
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$HAVE" ] && [ -n "$ZIP" ]; then
            echo "Descomprimiendo $ZIP"
            mkdir -p _unzipped
            unzip -q "$ZIP" -d _unzipped
          fi
          FILE=$(find . -path ./.git -prune -o -path '*/android/app/build.gradle.kts' -print -quit)
          if [ -z "$FILE" ]; then
            echo "::error::No encuentro android/app/build.gradle.kts. Sube las carpetas del proyecto o el archivo .zip a la raiz del repositorio."
            exit 1
          fi
          DIR=$(dirname "$(dirname "$FILE")")
          echo "Proyecto Android en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar NDK y CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: SonicColorsRecomp-APK
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Guardar informes si fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informes-de-error
          path: ${{ steps.find.outputs.dir }}/app/build/reports
          if-no-files-found: ignore
