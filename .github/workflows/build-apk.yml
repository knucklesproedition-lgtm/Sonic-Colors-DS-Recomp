name: Build APK

on:
  workflow_dispatch:        # boton "Run workflow" desde el navegador del movil
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar NDK y CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar rutas de C++ core
        run: |
          # Asegurar que la carpeta core esté accesible desde el espacio de trabajo de android/app/src/main/cpp
          if [ -d "core" ]; then
            ln -sfn ../../../../core android/app/src/main/cpp/core || cp -r core android/app/src/main/cpp/
          fi

      - name: Compilar APK debug
        working-directory: android
        run: gradle assembleDebug --stacktrace --info

      - uses: actions/upload-artifact@v4
        with:
          name: SonicColorsRecomp-debug
          path: android/app/build/outputs/apk/debug/*.apk
